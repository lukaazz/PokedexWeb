<form action="{{ url_for('cadastrar_pokemon') }}" method="POST">
  <label for="nome">Nome do pokemon:</label>
  <input type="text" name="nome" id="nome" required>
  <label for="tipo1">Tipo 1:</label>
  <input type="text" name="tipo1" id="tipo1" required>
  <label for="tipo2">Tipo 2:</label>
  <input type="text" name="tipo2" id="tipo2" required>
  <button type="submit">Cadastrar</button>
</form>
