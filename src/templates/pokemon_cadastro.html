{% extends "base.html" %}
{% block titulo %}Cadastrar pokémon — Times Pokémon{% endblock %}
{% block conteudo %}
<h1>Cadastrar pokémon</h1>

<form action="{{ url_for('cadastrar_pokemon') }}" method="POST" class="formulario">
  <fieldset>
    <legend>Dados do pokémon</legend>

    <div class="campo">
      <label for="nome">Nome do pokémon (obrigatório):</label>
      <input type="text" name="nome" id="nome" required>
    </div>

    <div class="campo">
      <label for="tipo1">Tipo 1 (obrigatório):</label>
      <input type="text" name="tipo1" id="tipo1" required>
    </div>

    <div class="campo">
      <label for="tipo2">Tipo 2 (opcional):</label>
      <input type="text" name="tipo2" id="tipo2">
    </div>
  </fieldset>

  <button type="submit" class="btn">Cadastrar</button>
</form>
{% endblock %}
